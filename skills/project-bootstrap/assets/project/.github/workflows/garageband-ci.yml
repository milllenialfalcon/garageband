# Garageband quality gate. Every pull request must pass this before the founder can merge.
# Set it as a *required* check in GitHub: Settings → Branches → Branch protection for `main`.
# Assumes a Node/TypeScript project. Each step skips itself if the matching npm script is missing,
# so add the scripts (typecheck, lint, test, e2e) to package.json to switch them on.
name: garageband-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run --if-present typecheck

      - name: Lint
        run: npm run --if-present lint

      - name: Unit and integration tests
        run: npm run --if-present test

      - name: Slop gate (design and accessibility checks)
        run: node scripts/slop-lint.mjs

      - name: Dependency audit (high and critical only)
        run: npm audit --audit-level=high --omit=dev

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Browser tests (Playwright)
        run: |
          if npm run | grep -q " e2e"; then
            npx playwright install --with-deps chromium
            npm run e2e
          else
            echo "No e2e script yet. browser-qa adds one with the first user flow."
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block vulnerable or badly licensed new dependencies
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0, GPL-3.0, SSPL-1.0

  # Optional deeper design check using the open-source Impeccable detector.
  # Not required until you pin a version you have tested (see skills/slop-gate).
  impeccable:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Impeccable detector (advisory)
        run: npx --yes impeccable detect || echo "Advisory only. Pin and verify before making this required."
