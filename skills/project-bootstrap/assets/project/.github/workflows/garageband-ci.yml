# Garageband quality gate. Every pull request must pass this before the founder can merge.
# Required checks (set by `bootstrap.sh --protect`): quality, e2e, secrets.
# Assumes a Node/TypeScript project. Steps that need package.json skip themselves until the app exists,
# and each npm script step skips itself if the script is missing, so add typecheck, lint, test and e2e
# scripts to package.json to switch them on.
name: garageband-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install
        if: hashFiles('package.json') != ''
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Typecheck
        if: hashFiles('package.json') != ''
        run: npm run --if-present typecheck

      - name: Lint
        if: hashFiles('package.json') != ''
        run: npm run --if-present lint

      - name: Unit and integration tests
        if: hashFiles('package.json') != ''
        run: npm run --if-present test

      - name: Slop gate (design and accessibility checks)
        run: node scripts/slop-lint.mjs

      - name: Dependency audit (high and critical only)
        if: hashFiles('package-lock.json') != ''
        run: npm audit --audit-level=high --omit=dev

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Browser tests (Playwright)
        run: |
          if [ -f package.json ] && npm run | grep -qE '^  e2e$'; then
            if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
            npx playwright install --with-deps chromium
            npm run e2e
          else
            echo "No e2e script yet. browser-qa adds one with the first user flow."
          fi
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Free for personal accounts. Repos owned by a GitHub *organisation* need a free licence key
          # from gitleaks.io saved as the GITLEAKS_LICENSE repository secret.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Needs the dependency graph, which private repos only have on some GitHub plans.
    # Advisory until you confirm it runs on your repo; then remove continue-on-error and make it required.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Block vulnerable or badly licensed new dependencies
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0, GPL-3.0, SSPL-1.0

  # Optional deeper design check using the open-source Impeccable detector.
  # Advisory until you pin a version you have tested (see the slop-gate skill).
  impeccable:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Impeccable detector (advisory)
        run: npx --yes impeccable detect || echo "Advisory only. Pin and verify before making this required."
